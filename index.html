<!DOCTYPE html>
<html>
<head>
  <title>AI Chatbot</title>
  <style>
    body { font-family: Arial; background: #eef2f7; display: flex; justify-content: center; padding-top: 40px; }
    .chat { width: 380px; background: white; border-radius: 10px; box-shadow: 0 2px 10px #0003; overflow: hidden; }
    .header { background: #4a6cf7; color: white; padding: 12px; text-align: center; font-weight: bold; }
    #messages { height: 380px; overflow-y: auto; padding: 10px; }
    .msg { margin: 6px 0; padding: 8px 12px; border-radius: 15px; max-width: 75%; white-space: pre-wrap; }
    .user { background: #4a6cf7; color: white; margin-left: auto; }
    .bot { background: #e5e7eb; }
    .input-box { display: flex; border-top: 1px solid #ddd; }
    input { flex: 1; padding: 12px; border: none; outline: none; }
    button { padding: 12px 16px; border: none; background: #4a6cf7; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <div class="chat">
    <div class="header">AI Chatbot</div>
    <div id="messages"></div>
    <div class="input-box">
      <input id="userInput" placeholder="Ask me anything..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const history = [];

    function addMessage(text, type) {
      const box = document.getElementById("messages");
      const div = document.createElement("div");
      div.className = "msg " + type;
      div.textContent = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const text = input.value.trim();
      if (text === "") return;

      addMessage(text, "user");
      input.value = "";
      history.push({ role: "user", content: text });

      const thinking = addMessage("Typing...", "bot");

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json();
        thinking.textContent = data.reply;
        if (res.ok) {
          history.push({ role: "assistant", content: data.reply });
        } else {
          history.pop();
        }
      } catch (err) {
        thinking.textContent = "Error: could not get a reply.";
        history.pop();
      }
    }

    document.getElementById("userInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
